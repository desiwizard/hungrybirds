<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hungry Bird</title>
    <meta property="og:title" content="Hungry Bird">
    <meta property="og:description" content="Flap, survive, and reach the top of the leaderboard!">
    <meta property="og:image" content="https://raw.githubusercontent.com/DesiWizard/hungrybirds/main/bird.jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #222; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #fff; 
            user-select: none;
            touch-action: manipulation;
        }
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 500px; 
            max-width: 98vw;
            max-height: 95vh;
            background: #70c5ce; 
            border: 4px solid #fff; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-layer { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            pointer-events: none; 
            display: flex; 
            justify-content: space-between; 
            padding: 16px 20px; 
            z-index: 10;
        }
        .stats { font-size: 18px; font-weight: bold; text-shadow: 1px 1px 3px #000; }
        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.78); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            text-align: center; 
            z-index: 20;
        }
        #overlay.hidden { display: none; }
        h1 { font-size: 36px; margin-bottom: 8px; color: #f7d02c; letter-spacing: 1px; }
        p { font-size: 15px; margin-bottom: 12px; color: #eee; }
        input[type="text"] { 
            width: 180px; 
            padding: 8px 12px; 
            font-size: 18px; 
            font-weight: bold;
            text-align: center; 
            text-transform: uppercase; 
            border-radius: 4px; 
            border: 2px solid #f7d02c; 
            margin-bottom: 12px; 
            outline: none; 
            background: #111;
            color: #fff;
        }
        button { 
            padding: 12px 28px; 
            font-size: 17px; 
            font-weight: bold; 
            color: #fff; 
            background-color: #f75c2c; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background-color: #d94519; }
        button:disabled { background-color: #777; cursor: not-allowed; }
        #leaderboard { 
            margin-top: 14px; 
            width: 100%; 
            max-width: 300px; 
            background: rgba(255, 255, 255, 0.08); 
            padding: 12px 16px; 
            border-radius: 6px; 
            font-size: 14px; 
            text-align: left; 
        }
        #leaderboard h3 { text-align: center; margin-bottom: 8px; color: #f7d02c; font-size: 15px; }
        .lb-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div id="ui-layer">
        <div class="stats">Score: <span id="currentScore">0</span></div>
        <div class="stats">Plays: <span id="totalPlays">0</span></div>
    </div>
    
    <div id="overlay">
        <h1 id="overlayTitle">HUNGRY BIRD</h1>
        <p id="overlaySub">Tap or Space to Jump</p>
        
        <div id="scoreSubmission" style="display: none; flex-direction: column; align-items: center; margin-bottom: 10px;">
            <p id="finalScoreText" style="font-size: 18px; font-weight: bold; margin-bottom: 8px;"></p>
            <input type="text" id="playerInitials" maxlength="5" placeholder="INITIALS" autocomplete="off">
            <button id="saveScoreBtn">Save Score</button>
        </div>

        <button id="startBtn">PLAY</button>

        <div id="leaderboard">
            <h3>TOP 5 SCORES</h3>
            <div id="leaderboardList">Loading...</div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyButgyy2ii0JbpDws6MSZ1ripkESlMGMuw",
        authDomain: "hungrybirds-88404.firebaseapp.com",
        projectId: "hungrybirds-88404",
        storageBucket: "hungrybirds-88404.firebasestorage.app",
        messagingSenderId: "266507044450",
        appId: "1:266507044450:web:8136abefd5790f0fd4333b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = "START";
    let animationFrameId = null;
    let score = 0;
    let frames = 0;

    const bird = {
        x: 90,
        y: 220,
        radius: 13,
        velocity: 0,
        gravity: 0.28,
        jump: -5.8,
        draw() {
            ctx.fillStyle = "#f7d02c";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(this.x + 6, this.y - 4, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(this.x + 7, this.y - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#d94519";
            ctx.beginPath();
            ctx.arc(this.x + 10, this.y + 2, 5, 0, Math.PI * 2);
            ctx.fill();
        },
        update() {
            this.velocity += this.gravity;
            this.y += this.velocity;

            if (this.y + this.radius >= canvas.height) {
                this.y = canvas.height - this.radius;
                return true;
            }
            if (this.y - this.radius <= 0) {
                this.y = this.radius;
                this.velocity = 0;
            }
            return false;
        },
        flap() {
            this.velocity = this.jump;
        },
        reset() {
            this.x = 90;
            this.y = 220;
            this.velocity = -2;
        }
    };

    const pipes = [];
    const pipeWidth = 58;
    const pipeGap = 150;

    function handlePipes() {
        if (frames % 115 === 0 && frames > 60) {
            const minH = 50;
            const topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - (minH * 2))) + minH;
            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: topHeight + pipeGap,
                passed: false
            });
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            const p = pipes[i];
            p.x -= 2.6;

            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(p.x, 0, pipeWidth, p.top);
            ctx.fillRect(p.x, p.bottom, pipeWidth, canvas.height - p.bottom);

            if (
                bird.x + bird.radius > p.x &&
                bird.x - bird.radius < p.x + pipeWidth &&
                (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom)
            ) {
                return true;
            }

            if (!p.passed && p.x + pipeWidth < bird.x) {
                p.passed = true;
                score++;
                document.getElementById("currentScore").innerText = score;
            }

            if (p.x + pipeWidth < 0) {
                pipes.splice(i, 1);
            }
        }
        return false;
    }

    function resetGame() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }
        bird.reset();
        pipes.length = 0;
        score = 0;
        frames = 0;
        document.getElementById("currentScore").innerText = "0";
    }

    function loop() {
        if (gameState !== "PLAYING") return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const hitGround = bird.update();
        bird.draw();

        const hitPipe = handlePipes();

        if (frames > 40 && (hitGround || hitPipe)) {
            endGame();
            return;
        }

        frames++;
        animationFrameId = requestAnimationFrame(loop);
    }

    function triggerFlap(e) {
        if (e && e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) {
            return;
        }
        if (gameState === "PLAYING") {
            bird.flap();
        }
    }

    window.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
            if (e.target && e.target.tagName === 'INPUT') return;
            e.preventDefault();
            triggerFlap(e);
        }
    });

    window.addEventListener("touchstart", (e) => {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
        triggerFlap(e);
    }, { passive: true });

    window.addEventListener("mousedown", (e) => {
        if (e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT')) return;
        triggerFlap(e);
    });

    async function incrementGlobalPlayCount() {
        try {
            const statsRef = db.collection("analytics").doc("stats");
            await statsRef.set({ playCount: firebase.firestore.FieldValue.increment(1) }, { merge: true });
        } catch (err) {
            console.error("Firestore counter increment failed:", err);
        }
    }

    function listenToPlayCount() {
        try {
            db.collection("analytics").doc("stats").onSnapshot((doc) => {
                if (doc.exists && doc.data().playCount !== undefined) {
                    document.getElementById("totalPlays").innerText = doc.data().playCount;
                }
            }, (err) => console.error("Stats listener error:", err));
        } catch (err) {
            console.error("Error setting stats listener:", err);
        }
    }

    async function submitScore(initials, finalScore) {
        try {
            await db.collection("leaderboard").add({
                initials: initials.toUpperCase().substring(0, 5),
                score: finalScore,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            await loadLeaderboard();
        } catch (err) {
            console.error("Error submitting score:", err);
        }
    }

    async function loadLeaderboard() {
        const lbList = document.getElementById("leaderboardList");
        try {
            const snapshot = await db.collection("leaderboard").orderBy("score", "desc").limit(5).get();
            lbList.innerHTML = "";
            let rank = 1;
            snapshot.forEach((doc) => {
                const data = doc.data();
                const row = document.createElement("div");
                row.className = "lb-row";
                row.innerHTML = `<span>#${rank} ${data.initials || "ANON"}</span><span>${data.score}</span>`;
                lbList.appendChild(row);
                rank++;
            });
            if (snapshot.empty) {
                lbList.innerHTML = "<div>No scores registered yet.</div>";
            }
        } catch (err) {
            console.error("Error fetching leaderboard:", err);
            lbList.innerHTML = "<div>Failed to load scores.</div>";
        }
    }

    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySub = document.getElementById("overlaySub");
    const startBtn = document.getElementById("startBtn");
    const scoreSubmission = document.getElementById("scoreSubmission");
    const playerInitialsInput = document.getElementById("playerInitials");
    const saveScoreBtn = document.getElementById("saveScoreBtn");
    const finalScoreText = document.getElementById("finalScoreText");

    function startGame() {
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }

        resetGame();
        gameState = "PLAYING";

        overlay.classList.add("hidden");
        scoreSubmission.style.display = "none";
        incrementGlobalPlayCount().catch(console.error);

        animationFrameId = requestAnimationFrame(loop);
    }

    function endGame() {
        if (gameState === "GAMEOVER") return;
        gameState = "GAMEOVER";
        
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        }

        overlay.classList.remove("hidden");
        overlayTitle.innerText = "GAME OVER";
        overlaySub.style.display = "none";
        finalScoreText.innerText = `Your Score: ${score}`;
        scoreSubmission.style.display = "flex";
        playerInitialsInput.value = "";
        
        startBtn.style.display = "block";
        startBtn.innerText = "PLAY AGAIN";
        
        loadLeaderboard();
    }

    startBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        startGame();
    });

    saveScoreBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        let initials = playerInitialsInput.value.trim();
        if (!initials) initials = "AAA";
        saveScoreBtn.disabled = true;
        saveScoreBtn.innerText = "Saving...";
        await submitScore(initials, score);
        scoreSubmission.style.display = "none";
        saveScoreBtn.disabled = false;
        saveScoreBtn.innerText = "Save Score";
        startBtn.innerText = "PLAY AGAIN";
        startBtn.style.display = "block";
    });

    bird.reset();
    bird.draw();
    listenToPlayCount();
    loadLeaderboard();

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))) {
            e.preventDefault();
            return false;
        }
    });

</script>

</body>
</html>
