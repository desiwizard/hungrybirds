<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hungry Birds v2 - Multi Levels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hungry Bird V2">
  <meta name="theme-color" content="#89cbf8">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #89cbf8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      touch-action: none;
      position: fixed;
      inset: 0;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #89cbf8;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background-color: #89cbf8;
    }

    #rotate-device-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      color: #fff;
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 25px;
    }
    .phone-anim-box {
      width: 70px;
      height: 120px;
      border: 4px solid #38bdf8;
      border-radius: 14px;
      position: relative;
      margin-bottom: 25px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      animation: phoneRotate 2.6s infinite ease-in-out;
      background: rgba(255,255,255,0.06);
    }
    .phone-anim-box::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      background: #38bdf8;
      border-radius: 2px;
    }
    .phone-anim-box::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      border: 2px solid #38bdf8;
      border-radius: 50%;
    }
    @keyframes phoneRotate {
      0% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(0deg) scale(1); }
      60% { transform: rotate(-90deg) scale(1.1); }
      80% { transform: rotate(-90deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .force-play-btn {
      background: #22c55e;
      color: #fff;
      border: 2px solid #fff;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
      margin-top: 15px;
    }

    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-device-overlay { display: flex !important; }
    }

    /* TOP HUD */
    .hud {
      position: absolute; 
      top: calc(8px + env(safe-area-inset-top, 0px)); 
      left: calc(12px + env(safe-area-inset-left, 0px)); 
      right: calc(12px + env(safe-area-inset-right, 0px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 25;
      gap: 8px;
    }
    .hud-pill {
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      border: 1.5px solid #ffeb3b;
      color: #ffeb3b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }
    .circle-btn:active { transform: scale(0.92); }

    .bonus-pulse {
      animation: bonusGlow 1.2s infinite alternate ease-in-out;
      color: #facc15 !important;
      font-weight: 900;
    }
    @keyframes bonusGlow {
      from { text-shadow: 0 0 4px #eab308; transform: scale(1); }
      to { text-shadow: 0 0 14px #facc15, 0 0 24px #ca8a04; transform: scale(1.08); }
    }

    /* Celebration Banner */
    #celebration-banner {
      display: none;
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      background: radial-gradient(circle, rgba(234, 179, 8, 0.95) 0%, rgba(180, 83, 9, 0.96) 100%);
      border: 3.5px solid #fef08a;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.8), 0 12px 30px rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 14px 34px;
      border-radius: 40px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
    }
    #celebration-banner.show-banner {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }
    #celebration-banner.fade-banner {
      opacity: 0;
      transform: translate(-50%, -80%) scale(0.9);
    }

    /* Modals */
    #level-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      z-index: 10000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
    }
    .modal-box {
      background: #1e293b;
      border: 2px solid #facc15;
      padding: 24px 34px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 90vw;
    }
    .modal-title {
      font-size: 24px;
      font-weight: bold;
      color: #facc15;
    }

    /* 3D Spinning Gold Coin */
    .coin-anim-wrap {
      perspective: 1000px;
      margin: 8px 0;
      display: none;
    }
    .gold-coin {
      width: 64px;
      height: 64px;
      background: radial-gradient(circle, #fde047 30%, #eab308 70%, #ca8a04 100%);
      border: 3.5px dashed #fef08a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      color: #713f12;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.7);
      animation: spinCoin 1.2s infinite linear;
    }
    @keyframes spinCoin {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg) scale(1.1); }
      100% { transform: rotateY(360deg); }
    }

    .modal-btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
    }
    .modal-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="rotate-device-overlay">
    <div class="phone-anim-box"></div>
    <h1 style="color: #ffeb3b; font-size: 22px; margin-bottom: 8px;">ROTATE YOUR PHONE</h1>
    <p style="color: #cbd5e1; font-size: 14px; max-width: 300px; line-height: 1.5;">
      Please rotate your phone sideways into <b>Landscape</b> mode to start playing.
    </p>
    <button id="force-rotate-btn" class="force-play-btn">
      🔄 TAP TO ROTATE & PLAY
    </button>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="celebration-banner">★ BONUS ROUND UNLOCKED! ★</div>

    <div class="hud">
      <div class="hud-pill">
        <span id="level-label-wrap">Lv <span id="level-num-hud" style="color:#ffeb3b;">1</span></span>
        <span>|</span>
        <span>🎯 <span id="target-count-hud">4</span> Targets</span>
      </div>

      <div class="hud-pill">
        <span>Score: <span id="score-val" style="color:#ffeb3b;">0</span></span>
      </div>

      <div class="hud-controls">
        <button class="circle-btn" id="btn-restart" title="Restart Level">🔄</button>
        <button class="circle-btn" id="btn-fs" title="Fullscreen">⛶</button>
      </div>
    </div>

    <div id="level-modal">
      <div class="modal-box">
        <div id="modal-title" class="modal-title">Level Cleared!</div>
        <div id="coin-wrap" class="coin-anim-wrap">
          <div class="gold-coin">★</div>
        </div>
        <p id="modal-desc" style="font-size: 14px; color: #cbd5e1;">All targets destroyed!</p>
        <button id="modal-action-btn" class="modal-btn">Next Level ➔</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const fsBtn = document.getElementById('btn-fs');
    const restartBtn = document.getElementById('btn-restart');
    const targetCountEl = document.getElementById('target-count-hud');
    const scoreValEl = document.getElementById('score-val');
    const levelNumHud = document.getElementById('level-num-hud');
    const levelLabelWrap = document.getElementById('level-label-wrap');
    const celebrationBanner = document.getElementById('celebration-banner');

    const modal = document.getElementById('level-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalActionBtn = document.getElementById('modal-action-btn');
    const coinWrap = document.getElementById('coin-wrap');

    function toggleFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }
    fsBtn.addEventListener('click', toggleFullscreen);

    let width = window.innerWidth;
    let height = window.innerHeight;

    let animTick = 0;
    let score = 0;
    let currentLevel = 1;
    const totalLevels = 6; // 5 regular levels + 1 bonus round

    let birdTypes = [];
    let selectedBirdIndex = 0;
    let birdHitboxes = [];

    const maxDragDist = 100;
    const launchPower = 0.32;
    const gravity = 0.30;
    const woodGravity = 0.58;

    let isDragging = false;
    let dragPos = { x: 0, y: 0 };
    let flyingBirds = [];
    let particles = [];
    let confettiList = [];
    let floatingScores = [];
    let structures = [];
    let targets = [];
    let floatingPlatforms = [];
    let obstacleNet = null;
    let isLevelReady = false;
    let isLevelCompleted = false;
    let hasFirstFired = false;

    let bigBirdEnergy = 100;
    let bigBirdFalling = false;
    let bigBirdFallY = 0;
    let bigBirdFallVy = 0;

    function resetBirdsForLevel(lvl) {
      const birdCount = (lvl === 6) ? 2 : 4;
      birdTypes = [
        { id: 'red',    name: 'Red',    color: '#ef4444', count: birdCount, r: 15 },
        { id: 'yellow', name: 'Yellow', color: '#eab308', count: birdCount, r: 15 },
        { id: 'blue',   name: 'Blue',   color: '#38bdf8', count: birdCount, r: 14 },
        { id: 'black',  name: 'Bomb',   color: '#1e293b', count: birdCount, r: 16 }
      ];
      selectedBirdIndex = 0;
      bigBirdEnergy = 100;
      bigBirdFalling = false;
      bigBirdFallY = 0;
      bigBirdFallVy = 0;
      hasFirstFired = false;
    }

    function ensureAvailableBirdSelected() {
      if (birdTypes[selectedBirdIndex].count <= 0) {
        const nextIdx = birdTypes.findIndex(b => b.count > 0);
        if (nextIdx !== -1) selectedBirdIndex = nextIdx;
      }
    }

    function addScore(pts) {
      score += pts;
      if (scoreValEl) scoreValEl.textContent = score;
    }

    function updateTargetCountHud() {
      const aliveCount = targets.filter(t => t.alive).length;
      if (targetCountEl) targetCountEl.textContent = aliveCount;
    }

    function createPiece(towerId, floor, x, y, w, h, isVertical, color, isRoof = false) {
      return {
        towerId, floor,
        x, y, w, h,
        vx: 0, vy: 0,
        angle: 0, va: 0,
        collapsed: false,
        isVertical,
        isRoof,
        color,
        hp: 1,
        alpha: 1.0,
        restTimer: 0
      };
    }

    // Trigger full celebration on entering Bonus Round
    function launchBonusCelebration() {
      confettiList = [];
      const colors = ['#fde047', '#38bdf8', '#ec4899', '#22c55e', '#f97316', '#a855f7', '#ffffff'];
      for (let i = 0; i < 90; i++) {
        confettiList.push({
          x: Math.random() * width,
          y: Math.random() * -height * 0.6,
          vx: (Math.random() - 0.5) * 3.5,
          vy: Math.random() * 3 + 2.2,
          sizeW: Math.random() * 8 + 5,
          sizeH: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          angle: Math.random() * Math.PI * 2,
          vAngle: (Math.random() - 0.5) * 0.15,
          isStar: Math.random() > 0.65,
          alpha: 1.0
        });
      }

      celebrationBanner.style.display = 'block';
      celebrationBanner.className = '';
      void celebrationBanner.offsetWidth;
      celebrationBanner.classList.add('show-banner');

      setTimeout(() => {
        celebrationBanner.classList.remove('show-banner');
        celebrationBanner.classList.add('fade-banner');
        setTimeout(() => {
          celebrationBanner.style.display = 'none';
        }, 500);
      }, 2300);
    }

    function loadLevel(lvl) {
      currentLevel = lvl;
      isLevelReady = false;
      isLevelCompleted = false;
      modal.style.display = 'none';
      coinWrap.style.display = 'none';

      if (lvl === 6) {
        levelLabelWrap.innerHTML = `<span class="bonus-pulse">BONUS 🌟</span>`;
      } else {
        levelLabelWrap.innerHTML = `Lv <span id="level-num-hud" style="color:#ffeb3b;">${lvl}</span>`;
      }

      const groundH = Math.max(height * 0.12, 42);
      const groundY = height - groundH;

      structures = [];
      targets = [];
      floatingPlatforms = [];
      obstacleNet = null;
      flyingBirds = [];
      particles = [];
      confettiList = [];
      floatingScores = [];
      resetBirdsForLevel(lvl);

      if (lvl === 1) {
        const t1X = width * 0.74;
        structures.push(createPiece('t1', 0, t1X - 22, groundY - 46, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t1', 0, t1X + 12, groundY - 46, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t1', 0, t1X - 26, groundY - 56, 52, 10, false, '#b45309', true));
        targets.push({ towerId: 't1', floor: 0, x: t1X, y: groundY - 18, vx: 0, vy: 0, r: 17, color: '#f97316', alive: true, falling: false });

        const t2X = width * 0.88;
        structures.push(createPiece('t2', 0, t2X - 22, groundY - 46, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t2', 0, t2X + 12, groundY - 46, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t2', 0, t2X - 26, groundY - 56, 52, 10, false, '#b45309', true));
        targets.push({ towerId: 't2', floor: 0, x: t2X, y: groundY - 18, vx: 0, vy: 0, r: 17, color: '#ec4899', alive: true, falling: false });

        structures.push(createPiece('t2', 1, t2X - 22, groundY - 102, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t2', 1, t2X + 12, groundY - 102, 10, 46, true, '#d99a38'));
        structures.push(createPiece('t2', 1, t2X - 26, groundY - 112, 52, 10, false, '#b45309', true));
        targets.push({ towerId: 't2', floor: 1, x: t2X, y: groundY - 74, vx: 0, vy: 0, r: 17, color: '#22c55e', alive: true, falling: false });

        floatingPlatforms.push({ id: 'p1', x: width * 0.60, y: height * 0.35, w: 100, h: 14, collapsed: false, vx: 0, vy: 0, angle: 0, va: 0, alpha: 1, restTimer: 0 });
        targets.push({ platformId: 'p1', x: width * 0.60, y: height * 0.35 - 16, vx: 0, vy: 0, r: 16, color: '#38bdf8', alive: true, falling: false });

      } else if (lvl === 2) {
        const fx = width * 0.76;
        structures.push(createPiece('f1', 0, fx - 36, groundY - 50, 10, 50, true, '#d99a38'));
        structures.push(createPiece('f1', 0, fx + 26, groundY - 50, 10, 50, true, '#d99a38'));
        structures.push(createPiece('f1', 0, fx - 42, groundY - 60, 84, 10, false, '#b45309', true));
        targets.push({ towerId: 'f1', floor: 0, x: fx - 5, y: groundY - 20, vx: 0, vy: 0, r: 16, color: '#ef4444', alive: true, falling: false });

        structures.push(createPiece('f1', 1, fx - 36, groundY - 110, 10, 50, true, '#d99a38'));
        structures.push(createPiece('f1', 1, fx + 26, groundY - 110, 10, 50, true, '#d99a38'));
        structures.push(createPiece('f1', 1, fx - 42, groundY - 120, 84, 10, false, '#b45309', true));
        targets.push({ towerId: 'f1', floor: 1, x: fx - 5, y: groundY - 80, vx: 0, vy: 0, r: 16, color: '#eab308', alive: true, falling: false });

        floatingPlatforms.push({ id: 'p2_1', x: width * 0.52, y: height * 0.38, w: 80, h: 12, collapsed: false, vx: 0, vy: 0, angle: 0, va: 0, alpha: 1, restTimer: 0 });
        targets.push({ platformId: 'p2_1', x: width * 0.52, y: height * 0.38 - 14, vx: 0, vy: 0, r: 14, color: '#a855f7', alive: true, falling: false });

        floatingPlatforms.push({ id: 'p2_2', x: width * 0.63, y: height * 0.22, w: 80, h: 12, collapsed: false, vx: 0, vy: 0, angle: 0, va: 0, alpha: 1, restTimer: 0 });
        targets.push({ platformId: 'p2_2', x: width * 0.63, y: height * 0.22 - 14, vx: 0, vy: 0, r: 14, color: '#06b6d4', alive: true, falling: false });

      } else if (lvl === 3) {
        const sx = width * 0.80;
        for (let fl = 0; fl < 3; fl++) {
          const by = groundY - (fl * 52);
          structures.push(createPiece('s1', fl, sx - 20, by - 46, 10, 46, true, '#d99a38'));
          structures.push(createPiece('s1', fl, sx + 12, by - 46, 10, 46, true, '#d99a38'));
          structures.push(createPiece('s1', fl, sx - 26, by - 56, 52, 10, false, '#b45309', true));
          targets.push({ towerId: 's1', floor: fl, x: sx - 4, y: by - 22, vx: 0, vy: 0, r: 15, color: fl === 2 ? '#ec4899' : '#10b981', alive: true, falling: false });
        }

        const wallX = width * 0.68;
        structures.push(createPiece('wall', 0, wallX, groundY - 60, 16, 60, true, '#78350f'));

        floatingPlatforms.push({ id: 'p3_1', x: width * 0.50, y: height * 0.30, w: 90, h: 12, collapsed: false, vx: 0, vy: 0, angle: 0, va: 0, alpha: 1, restTimer: 0 });
        targets.push({ platformId: 'p3_1', x: width * 0.50, y: height * 0.30 - 14, vx: 0, vy: 0, r: 15, color: '#f59e0b', alive: true, falling: false });

      } else if (lvl === 4) {
        const q1X = width * 0.72;
        const q2X = width * 0.85;

        [q1X, q2X].forEach((tx, idx) => {
          structures.push(createPiece(`tw_${idx}`, 0, tx - 20, groundY - 46, 10, 46, true, '#d99a38'));
          structures.push(createPiece(`tw_${idx}`, 0, tx + 12, groundY - 46, 10, 46, true, '#d99a38'));
          structures.push(createPiece(`tw_${idx}`, 0, tx - 24, groundY - 56, 48, 10, false, '#b45309', true));
          targets.push({ towerId: `tw_${idx}`, floor: 0, x: tx - 4, y: groundY - 20, vx: 0, vy: 0, r: 15, color: '#f97316', alive: true, falling: false });

          structures.push(createPiece(`tw_${idx}`, 1, tx - 20, groundY - 102, 10, 46, true, '#d99a38'));
          structures.push(createPiece(`tw_${idx}`, 1, tx + 12, groundY - 102, 10, 46, true, '#d99a38'));
          structures.push(createPiece(`tw_${idx}`, 1, tx - 24, groundY - 112, 48, 10, false, '#b45309', true));
          targets.push({ towerId: `tw_${idx}`, floor: 1, x: tx - 4, y: groundY - 76, vx: 0, vy: 0, r: 15, color: '#ec4899', alive: true, falling: false });
        });

        floatingPlatforms.push({ id: 'p4_1', x: width * 0.52, y: height * 0.28, w: 85, h: 12, collapsed: false, vx: 0, vy: 0, angle: 0, va: 0, alpha: 1, restTimer: 0 });
        targets.push({ platformId: 'p4_1', x: width * 0.52, y: height * 0.28 - 14, vx: 0, vy: 0, r: 14, color: '#06b6d4', alive: true, falling: false });

      } else if (lvl === 5) {

        structures.push(createPiece('bn_2', 0, bx2 - 26, groundY - 56, 52, 10, false, '#b45309', true));
        targets.push({ towerId: 'bn_2', floor: 0, x: bx2, y: groundY - 18, vx: 0, vy: 0, r: 17, color: '#ec4899', alive: true, falling: false });

      }

    function checkLevelState() {
      if (!isLevelReady || isLevelCompleted) return;

      const remainingTargets = targets.filter(t => t.alive).length;
      const totalBirds = birdTypes.reduce((sum, b) => sum + b.count, 0);

      // VICTORY
      if (targets.length > 0 && remainingTargets === 0) {
        isLevelCompleted = true;

        setTimeout(() => {
          if (currentLevel === 6) {
            // BONUS ROUND WON
            const leftoverBirds = totalBirds;
            const bonusReward = leftoverBirds * 500;
            addScore(bonusReward);

            coinWrap.style.display = 'block';
            modalTitle.textContent = `Bonus`;
            modalDesc.innerHTML = `
              <b>${leftoverBirds}</b> Birds Remaining × 500 = <span style="color:#facc15; font-size:18px; font-weight:900;">+${bonusReward} BONUS PTS!</span><br>
              Total Score: <b>${score}</b>
            `;
            modalActionBtn.textContent = 'Restart Game 🔄';
            modalActionBtn.onclick = () => { score = 0; addScore(0); loadLevel(1); };
          }
          else if (currentLevel < totalLevels) {
            coinWrap.style.display = 'none';
            if (currentLevel === 5) {
              modalTitle.textContent = `Level 5 Cleared! 🎉`;
              modalDesc.textContent = `Bonus`;
              modalActionBtn.textContent = 'Play Bonus Round ➔';
            } else {
              modalTitle.textContent = `Level ${currentLevel} Cleared! 🎉`;
              modalDesc.textContent = `Excellent Shot! Ready for Level ${currentLevel + 1}?`;
              modalActionBtn.textContent = 'Next Level ➔';
            }
            modalActionBtn.onclick = () => loadLevel(currentLevel + 1);
          } else {
            coinWrap.style.display = 'none';
            modalTitle.textContent = `Champion! All Levels Won! 🏆`;
            modalDesc.textContent = `Final Score: ${score}`;
            modalActionBtn.textContent = 'Play Again 🔄';
            modalActionBtn.onclick = () => { score = 0; addScore(0); loadLevel(1); };
          }
          modal.style.display = 'flex';
        }, 1000);
      }
      // GIANT BIRD STARVED
      else if (bigBirdEnergy <= 0 && !isLevelCompleted) {
        isLevelCompleted = true;
        setTimeout(() => {
          coinWrap.style.display = 'none';
          if (currentLevel === 6) {
            modalTitle.textContent = `So Close!`;
            modalDesc.textContent = `Better luck next time!`;
            modalActionBtn.textContent = 'Continue to Next Level ➔';
            modalActionBtn.onclick = () => { score = 0; addScore(0); loadLevel(1); };
          } else {
            modalTitle.textContent = `Giant Bird Starved! 💀`;
            modalDesc.textContent = `Energy depleted! Keep the giant bird fed.`;
            modalActionBtn.textContent = 'Retry Level 🔄';
            modalActionBtn.onclick = () => loadLevel(currentLevel);
          }
          modal.style.display = 'flex';
        }, 1200);
      }
      // OUT OF BIRDS
      else if (totalBirds === 0 && flyingBirds.length === 0 && remainingTargets > 0) {
        isLevelCompleted = true;
        setTimeout(() => {
          coinWrap.style.display = 'none';
          if (currentLevel === 6) {
            modalTitle.textContent = `So Close!`;
            modalDesc.textContent = `Better luck next time!`;
            modalActionBtn.textContent = 'Continue to Next Level ➔';
            modalActionBtn.onclick = () => { score = 0; addScore(0); loadLevel(1); };
          } else {
            modalTitle.textContent = `Level Failed! 😢`;
            modalDesc.textContent = `${remainingTargets} targets remained unbroken.`;
            modalActionBtn.textContent = 'Retry Level 🔄';
            modalActionBtn.onclick = () => loadLevel(currentLevel);
          }
          modal.style.display = 'flex';
        }, 1200);
      }
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      loadLevel(currentLevel);
    }
    window.addEventListener('resize', resizeCanvas);

    function spawnExplosion(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const speed = Math.random() * 5 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 4 + 2,
          color,
          alpha: 1,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function addFloatingScore(x, y, text) {
      floatingScores.push({ x, y, text, alpha: 1 });
    }

    function triggerBombExplosion(bombX, bombY) {
      const blastRadius = 140;

      for (let i = 0; i < 48; i++) {
        const speed = Math.random() * 9 + 2;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x: bombX,
          y: bombY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          size: Math.random() * 8 + 4,
          color: (i % 3 === 0) ? '#f97316' : ((i % 3 === 1) ? '#ef4444' : '#1e293b'),
          alpha: 1,
          decay: Math.random() * 0.03 + 0.015
        });
      }
      addFloatingScore(bombX, bombY - 30, 'BOOOM! +500');
      addScore(500);

      for (let i = structures.length - 1; i >= 0; i--) {
        const p = structures[i];
        const dist = Math.hypot((p.x + p.w / 2) - bombX, (p.y + p.h / 2) - bombY);
        if (dist < blastRadius) {
          spawnExplosion(p.x + p.w / 2, p.y + p.h / 2, p.color, 16);
          structures.splice(i, 1);
          addScore(150);
        }
      }

      targets.forEach(t => {
        if (t.alive) {
          const dist = Math.hypot(t.x - bombX, t.y - bombY);
          if (dist < blastRadius) {
            t.alive = false;
            spawnExplosion(t.x, t.y, t.color, 28);
            addFloatingScore(t.x, t.y - 20, '+1000');
            addScore(1000);
            updateTargetCountHud();
            bigBirdEnergy = Math.min(100, bigBirdEnergy + 25);
          }
        }
      });

      floatingPlatforms.forEach(fp => {
        if (!fp.collapsed) {
          const distPlat = Math.hypot(fp.x - bombX, fp.y - bombY);
          if (distPlat < blastRadius + 20) {
            collapseFloatingPlatform(fp, 5);
          }
        }
      });
    }

    function triggerCascadeFall(towerId, floor) {
      structures.forEach(p => {
        if (p.towerId === towerId && p.floor >= floor && !p.collapsed) {
          p.collapsed = true;
          p.vy = 2.4;
          p.vx = (Math.random() * 2 - 1) * 1.5;
          p.va = (Math.random() - 0.5) * 0.15;
        }
      });

      targets.forEach(t => {
        if (t.towerId === towerId && t.floor >= floor && t.alive) {
          t.falling = true;
          t.vy = 2.5;
          t.vx = (Math.random() * 2 - 1);
        }
      });
    }

    function breakStructureNear(hitX, hitY, hitPower) {
      for (let i = structures.length - 1; i >= 0; i--) {
        const p = structures[i];
        const dist = Math.hypot(p.x + p.w / 2 - hitX, p.y + p.h / 2 - hitY);
        if (dist < 80) {
          spawnExplosion(p.x + p.w / 2, p.y + p.h / 2, p.color, 14);
          const tId = p.towerId;
          const fl = p.floor;
          structures.splice(i, 1);
          addScore(100);
          triggerCascadeFall(tId, fl);
        }
      }

      targets.forEach(t => {
        if (t.alive) {
          const dist = Math.hypot(t.x - hitX, t.y - hitY);
          if (dist < 65) {
            t.alive = false;
            spawnExplosion(t.x, t.y, t.color, 24);
            addFloatingScore(t.x, t.y - 20, '+1000');
            addScore(1000);
            updateTargetCountHud();
          }
        }
      });
    }

    function collapseFloatingPlatform(fp, hitPower = 3) {
      if (!fp.collapsed) {
        fp.collapsed = true;
        fp.vx = (hitPower * 0.4) + (Math.random() * 2 - 1);
        fp.vy = 2.2;
        fp.va = (Math.random() * 0.1) - 0.05;
        spawnExplosion(fp.x, fp.y, '#854d0e', 14);
        addFloatingScore(fp.x, fp.y - 15, 'Platform Cut!');
        addScore(250);

        targets.forEach(t => {
          if (t.platformId === fp.id && t.alive) {
            t.falling = true;
            t.vx = fp.vx;
            t.vy = fp.vy + 1.2;
          }
        });
      }
    }

    function checkStructuralIntegrity(groundY) {
      structures.forEach(piece => {
        if (!piece.collapsed) {
          const isOnGround = Math.abs((piece.y + piece.h) - groundY) < 14;

          if (piece.isRoof) {
            const hasPillarBelow = structures.some(other => {
              return other !== piece && !other.collapsed && other.towerId === piece.towerId &&
                     other.floor === piece.floor && other.isVertical;
            });
            if (!hasPillarBelow) {
              triggerCascadeFall(piece.towerId, piece.floor);
            }
          }
          else if (piece.isVertical && !isOnGround) {
            const hasSupportBelow = structures.some(other => {
              return other !== piece && !other.collapsed && other.towerId === piece.towerId &&
                     other.floor === piece.floor - 1 && other.isRoof;
            });
            if (!hasSupportBelow) {
              triggerCascadeFall(piece.towerId, piece.floor);
            }
          }
        }
      });
    }

    function drawObstacleNet() {
      if (!obstacleNet) return;
      ctx.save();
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2.5;
      ctx.fillRect(obstacleNet.x, obstacleNet.y, obstacleNet.w, obstacleNet.h);
      ctx.strokeRect(obstacleNet.x, obstacleNet.y, obstacleNet.w, obstacleNet.h);

      ctx.fillStyle = '#facc15';
      ctx.fillRect(obstacleNet.x - 3, obstacleNet.y, obstacleNet.w + 6, 8);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1;
      for (let y = obstacleNet.y + 12; y < obstacleNet.y + obstacleNet.h; y += 8) {
        ctx.beginPath();
        ctx.moveTo(obstacleNet.x, y);
        ctx.lineTo(obstacleNet.x + obstacleNet.w, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTree(groundY) {
      const treeX = Math.max(width * 0.065, 55);
      const branchY = height * 0.44;

      ctx.save();
      ctx.fillStyle = '#4a2810';
      ctx.strokeStyle = '#271206';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.quadraticCurveTo(treeX - 10, groundY - 80, treeX - 4, branchY - 50);
      ctx.quadraticCurveTo(treeX + 16, branchY - 90, treeX + 28, branchY - 110);
      ctx.quadraticCurveTo(treeX + 38, branchY - 50, treeX + 22, groundY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#5c3317';
      ctx.beginPath();
      ctx.moveTo(treeX + 8, branchY + 14);
      ctx.quadraticCurveTo(treeX + 32, branchY + 6, treeX + 70, branchY);
      ctx.lineTo(treeX + 74, branchY + 6);
      ctx.quadraticCurveTo(treeX + 34, branchY + 18, treeX + 12, branchY + 24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#2d6a1b';
      ctx.beginPath();
      ctx.arc(treeX + 26, branchY - 110, 36, 0, Math.PI * 2);
      ctx.arc(treeX - 8, branchY - 85, 28, 0, Math.PI * 2);
      ctx.arc(treeX + 54, branchY - 95, 26, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#3e8e24';
      ctx.beginPath();
      ctx.arc(treeX + 22, branchY - 114, 30, 0, Math.PI * 2);
      ctx.arc(treeX - 6, branchY - 88, 22, 0, Math.PI * 2);
      ctx.arc(treeX + 50, branchY - 98, 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#48a02a';
      ctx.beginPath();
      ctx.arc(treeX + 72, branchY + 8, 10, 0, Math.PI * 2);
      ctx.arc(treeX + 82, branchY + 4, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBigBird(groundY) {
      let isCritical = (bigBirdEnergy <= 25 && bigBirdEnergy > 0);
      let flickerRed = Math.floor(animTick / 6) % 2 === 0;

      let mainColor = '#ef4444';
      let armorColor = '#991b1b';
      let eyeColor = '#fef08a';

      if (bigBirdEnergy <= 0) {
        mainColor = '#475569'; armorColor = '#1e293b'; eyeColor = '#94a3b8';
      } else if (isCritical) {
        mainColor = flickerRed ? '#ef4444' : '#475569';
        armorColor = flickerRed ? '#991b1b' : '#1e293b';
        eyeColor = flickerRed ? '#fef08a' : '#cbd5e1';
      } else if (bigBirdEnergy <= 65) {
        mainColor = '#f97316'; armorColor = '#9a3412'; eyeColor = '#fef08a';
      }

      const treeX = Math.max(width * 0.065, 55);
      const branchY = height * 0.44;
      const tremble = isCritical ? (Math.random() * 2.5 - 1.25) : 0;
      const cx = (treeX + 38) + tremble;
      let cy = branchY - 26;

      if (bigBirdFalling) {
        cy += bigBirdFallY;
      }

      ctx.save();
      ctx.fillStyle = armorColor;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx - 8, cy - 24);
      ctx.lineTo(cx - 34, cy - 42);
      ctx.lineTo(cx - 18, cy - 14);
      ctx.lineTo(cx - 40, cy - 20);
      ctx.lineTo(cx - 14, cy);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.moveTo(cx - 26, cy - 12);
      ctx.lineTo(cx - 10, cy - 30);
      ctx.lineTo(cx + 18, cy - 22);
      ctx.lineTo(cx + 30, cy + 4);
      ctx.lineTo(cx + 12, cy + 26);
      ctx.lineTo(cx - 22, cy + 24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = armorColor;
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy - 10);
      ctx.lineTo(cx + 16, cy - 6);
      ctx.lineTo(cx + 22, cy + 8);
      ctx.lineTo(cx + 8, cy + 22);
      ctx.lineTo(cx - 8, cy + 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(cx + 24, cy - 14);
      ctx.lineTo(cx + 52, cy - 2);
      ctx.lineTo(cx + 28, cy + 14);
      ctx.lineTo(cx + 26, cy + 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 26, cy - 2);
      ctx.lineTo(cx + 44, cy - 1);
      ctx.stroke();

      if (bigBirdEnergy <= 0) {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx + 8, cy - 16); ctx.lineTo(cx + 16, cy - 8);
        ctx.moveTo(cx + 16, cy - 16); ctx.lineTo(cx + 8, cy - 8);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(cx + 4, cy - 20);
        ctx.lineTo(cx + 22, cy - 16);
        ctx.lineTo(cx + 16, cy - 6);
        ctx.lineTo(cx + 2, cy - 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = eyeColor;
        ctx.beginPath();
        ctx.moveTo(cx + 8, cy - 16);
        ctx.lineTo(cx + 19, cy - 13);
        ctx.lineTo(cx + 13, cy - 8);
        ctx.closePath();
        ctx.fill();
      }

      // HEALTH BADGE ON TREE TRUNK UNDER BIG BIRD & BRANCH
      const bY = branchY + 36;
      const bVal = Math.max(0, Math.ceil(bigBirdEnergy));
      let bColor = '#2ed573';
      if (bVal <= 25) bColor = '#ff4757';
      else if (bVal <= 60) bColor = '#ffa502';

      ctx.fillStyle = 'rgba(10, 15, 30, 0.94)';
      ctx.strokeStyle = bColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(treeX - 16, bY, 96, 46, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = 'bold 8.5px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BIRD HEALTH', treeX + 32, bY + 13);

      ctx.fillStyle = bColor;
      ctx.font = '900 22px Courier New, monospace';
      ctx.fillText(`⚡${bVal}`, treeX + 32, bY + 37);

      ctx.restore();
    }

    function drawBirdGridDeck(groundY) {
      birdHitboxes = [];
      const deckStartX = 10;
      const boxW = 54;
      const boxH = 42;
      const gap = 6;
      const totalW = (boxW * 2) + gap;
      const totalH = (boxH * 2) + gap;
      const gridY = groundY - totalH - 6;

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.strokeStyle = '#166534';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.rect(deckStartX - 4, gridY - 4, totalW + 8, totalH + 8);
      ctx.fill();
      ctx.stroke();

      birdTypes.forEach((b, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const bx = deckStartX + (col * (boxW + gap));
        const by = gridY + (row * (boxH + gap));
        const isSelected = (i === selectedBirdIndex);
        const isEmpty = (b.count <= 0);

        birdHitboxes.push({ x: bx + (boxW / 2), y: by + (boxH / 2), w: boxW, h: boxH, index: i });

        if (isSelected) {
          ctx.fillStyle = '#bbf7d0';
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
        } else {
          ctx.fillStyle = '#dcfce7';
          ctx.strokeStyle = '#86efac';
          ctx.lineWidth = 1.5;
        }

        ctx.beginPath();
        ctx.rect(bx, by, boxW, boxH);
        ctx.fill();
        ctx.stroke();

        const birdCx = bx + 19;
        const birdCy = by + 24;

        ctx.beginPath();
        ctx.arc(birdCx, birdCy, b.r, 0, Math.PI * 2);
        ctx.fillStyle = isEmpty ? '#94a3b8' : b.color;
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(birdCx + 3, birdCy - 3, 2.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(birdCx + 4.2, birdCy - 3, 1.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(birdCx + b.r - 2, birdCy - 3);
        ctx.lineTo(birdCx + b.r + 8, birdCy);
        ctx.lineTo(birdCx + b.r - 2, birdCy + 4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        const badgeW = 20;
        const badgeH = 14;
        const badgeX = bx + boxW - badgeW - 3;
        const badgeY = by + 3;

        ctx.fillStyle = isSelected ? '#15803d' : '#14532d';
        ctx.fillRect(badgeX, badgeY, badgeW, badgeH);
        ctx.strokeStyle = isSelected ? '#f59e0b' : '#166534';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(badgeX, badgeY, badgeW, badgeH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`×${b.count}`, badgeX + (badgeW / 2), badgeY + (badgeH / 2) + 0.5);
      });
      ctx.restore();
    }

    function renderBirdAt(bx, by, birdObj, rotation = 0) {
      ctx.save();
      ctx.translate(bx, by);
      if (rotation) ctx.rotate(rotation);

      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fillStyle = birdObj.color;
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(4, -2, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(5.5, -2, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.moveTo(10, -2);
      ctx.lineTo(19, 1);
      ctx.lineTo(10, 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawTrajectory(anchorX, anchorY, birdX, birdY, groundY) {
      const vx = (anchorX - birdX) * launchPower;
      const vy = (anchorY - birdY) * launchPower;
      let simX = birdX;
      let simY = birdY;
      let simVx = vx;
      let simVy = vy;

      ctx.save();
      for (let step = 0; step < 30; step++) {
        simX += simVx;
        simY += simVy;
        simVy += gravity;
        if (simY > groundY) break;

        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.15, 0.95 - (step * 0.03))})`;
        ctx.beginPath();
        ctx.arc(simX, simY, Math.max(2, 4.5 - (step * 0.08)), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFloatingPlatforms(groundY) {
      for (let i = floatingPlatforms.length - 1; i >= 0; i--) {
        const fp = floatingPlatforms[i];

        if (fp.collapsed) {
          fp.x += fp.vx;
          fp.y += fp.vy;
          fp.vy += woodGravity;
          fp.angle += fp.va;

          if (fp.x + fp.w / 2 >= width - 6) {
            fp.x = width - 6 - fp.w / 2;
            fp.vx = -Math.abs(fp.vx) * 0.4;
          }

          structures.forEach(p => {
            if (!p.collapsed) {
              const hitDist = Math.hypot((p.x + p.w / 2) - fp.x, (p.y + p.h / 2) - fp.y);
              if (hitDist < 45) {
                spawnExplosion(p.x + p.w / 2, p.y + p.h / 2, p.color, 12);
                triggerCascadeFall(p.towerId, p.floor);
                addScore(100);
              }
            }
          });

          if (fp.y + fp.h >= groundY) {
            fp.y = groundY - fp.h;
            fp.vy = -fp.vy * 0.15;
            fp.vx *= 0.70;
            fp.va *= 0.60;
            if (Math.abs(fp.vy) < 0.3) fp.vy = 0;
            if (Math.abs(fp.vx) < 0.1) fp.vx = 0;
            if (Math.abs(fp.va) < 0.01) fp.va = 0;

            fp.restTimer++;
            if (fp.restTimer > 60) {
              fp.alpha -= 0.035;
              if (fp.alpha <= 0) {
                spawnExplosion(fp.x, fp.y, '#854d0e', 6);
                floatingPlatforms.splice(i, 1);
                continue;
              }
            }
          }
        }

        ctx.save();
        ctx.globalAlpha = fp.alpha;

        if (!fp.collapsed) {
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(fp.x - (fp.w / 2) + 10, 0);
          ctx.lineTo(fp.x - (fp.w / 2) + 10, fp.y);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(fp.x + (fp.w / 2) - 10, 0);
          ctx.lineTo(fp.x + (fp.w / 2) - 10, fp.y);
          ctx.stroke();

          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(fp.x - (fp.w / 2) + 10, fp.y, 4, 0, Math.PI * 2);
          ctx.arc(fp.x + (fp.w / 2) - 10, fp.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.translate(fp.x, fp.y + (fp.h / 2));
        ctx.rotate(fp.angle);
        ctx.fillStyle = '#854d0e';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2.5;
        ctx.fillRect(-fp.w / 2, -fp.h / 2, fp.w, fp.h);
        ctx.strokeRect(-fp.w / 2, -fp.h / 2, fp.w, fp.h);
        ctx.restore();
      }
    }

    function drawConfetti() {
      for (let i = confettiList.length - 1; i >= 0; i--) {
        const c = confettiList[i];
        c.x += c.vx;
        c.y += c.vy;
        c.angle += c.vAngle;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.angle);
        ctx.fillStyle = c.color;

        if (c.isStar) {
          ctx.beginPath();
          ctx.arc(0, 0, 4.5, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-c.sizeW / 2, -c.sizeH / 2, c.sizeW, c.sizeH);
        }
        ctx.restore();

        if (c.y > height + 20) {
          confettiList.splice(i, 1);
        }
      }
    }

    function render() {
      animTick++;
      ctx.clearRect(0, 0, width, height);

      const groundH = Math.max(height * 0.12, 42);
      const groundY = height - groundH;

      if (hasFirstFired && !isLevelCompleted) {
        bigBirdEnergy = Math.max(0, bigBirdEnergy - 0.024);
        if (bigBirdEnergy <= 0 && !bigBirdFalling) {
          bigBirdFalling = true;
          bigBirdFallVy = -3;
        }
      }

      if (bigBirdFalling) {
        bigBirdFallVy += 0.35;
        bigBirdFallY += bigBirdFallVy;
        const branchY = height * 0.44;
        const bBaseY = branchY - 26;
        if (bBaseY + bigBirdFallY >= groundY - 20) {
          bigBirdFallY = groundY - 20 - bBaseY;
          bigBirdFallVy = 0;
        }
      }

      // Sky Background
      ctx.fillStyle = '#89cbf8';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(width * 0.86, height * 0.22, 44, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#9aa0d9';
      ctx.beginPath();
      ctx.moveTo(width * 0.20, groundY);
      ctx.lineTo(width * 0.38, height * 0.44);
      ctx.lineTo(width * 0.56, groundY);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#b3b8eb';
      ctx.beginPath();
      ctx.moveTo(width * 0.44, groundY);
      ctx.lineTo(width * 0.64, height * 0.38);
      ctx.lineTo(width * 0.84, groundY);
      ctx.closePath();
      ctx.fill();

      // Ground
      ctx.fillStyle = '#42281d';
      ctx.fillRect(0, groundY, width, groundH);
      ctx.fillStyle = '#55a234';
      ctx.fillRect(0, groundY, width, 14);

      // Draw Tree, Big Bird & Deck
      drawTree(groundY);
      drawBigBird(groundY);
      drawBirdGridDeck(groundY);

      // Draw Obstacle Net in Bonus Level
      drawObstacleNet();

      // Slingshot
      const treeX = Math.max(width * 0.065, 55);
      const sx = treeX + 175;
      const sy = groundY - 105;
      const leftForkX = sx - 18;
      const leftForkY = sy - 34;
      const rightForkX = sx + 18;
      const rightForkY = sy - 34;
      const centerAnchorX = sx;
      const centerAnchorY = sy - 20;

      ctx.strokeStyle = '#3e2316';
      ctx.lineWidth = 11;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx, groundY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(leftForkX, leftForkY);
      ctx.stroke();

      const currentBird = birdTypes[selectedBirdIndex];
      const hasBirds = currentBird && currentBird.count > 0;
      let birdX = centerAnchorX;
      let birdY = centerAnchorY;

      if (isDragging) {
        birdX = dragPos.x;
        birdY = dragPos.y;
      } else if (hasBirds) {
        birdY += Math.sin(animTick * 0.08) * 1.5;
      }

      if (hasBirds) {
        ctx.strokeStyle = '#1e1b18';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(leftForkX, leftForkY);
        ctx.lineTo(birdX - 6, birdY);
        ctx.stroke();
      }

      if (isDragging && hasBirds) {
        drawTrajectory(centerAnchorX, centerAnchorY, birdX, birdY, groundY);
      }

      if (hasBirds) {
        renderBirdAt(birdX, birdY, currentBird);
      }

      ctx.strokeStyle = '#3e2316';
      ctx.lineWidth = 11;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(rightForkX, rightForkY);
      ctx.stroke();

      if (hasBirds) {
        ctx.strokeStyle = '#292524';
        ctx.lineWidth = 4.5;
        ctx.beginPath();
        ctx.moveTo(rightForkX, rightForkY);
        ctx.lineTo(birdX + 6, birdY);
        ctx.stroke();
      }

      drawFloatingPlatforms(groundY);
      checkStructuralIntegrity(groundY);

      // FLYING BIRDS COLLISION
      for (let i = flyingBirds.length - 1; i >= 0; i--) {
        const fb = flyingBirds[i];
        fb.x += fb.vx;
        fb.y += fb.vy;
        fb.vy += gravity;

        const angle = Math.atan2(fb.vy, fb.vx);
        renderBirdAt(fb.x, fb.y, fb, angle);

        let birdExploded = false;

        // Obstacle Net Collision (Bonus Round)
        if (obstacleNet) {
          const hitNetX = (fb.x >= obstacleNet.x - 14 && fb.x <= obstacleNet.x + obstacleNet.w + 14);
          const hitNetY = (fb.y >= obstacleNet.y && fb.y <= groundY);
          if (hitNetX && hitNetY) {
            spawnExplosion(fb.x, fb.y, '#f8fafc', 10);
            fb.vx = -Math.abs(fb.vx) * 0.25;
            fb.vy = 2.0;
          }
        }

        // Targets Collision
        for (let t of targets) {
          if (t.alive) {
            const dist = Math.hypot(fb.x - t.x, fb.y - t.y);
            if (dist < 15 + t.r) {
              if (fb.id === 'black') {
                triggerBombExplosion(fb.x, fb.y);
                flyingBirds.splice(i, 1);
                birdExploded = true;
                break;
              }

              t.alive = false;
              spawnExplosion(t.x, t.y, t.color, 24);
              addFloatingScore(t.x, t.y - 20, '+1000');
              addScore(1000);
              updateTargetCountHud();
              bigBirdEnergy = Math.min(100, bigBirdEnergy + 25);

              if (t.platformId) {
                const plat = floatingPlatforms.find(p => p.id === t.platformId);
                if (plat) collapseFloatingPlatform(plat, 4);
              }

              breakStructureNear(t.x, t.y, 4);
              fb.vx *= 0.7;
            }
          }
        }
        if (birdExploded) continue;

        // Floating Platforms Collision
        for (let fp of floatingPlatforms) {
          if (!fp.collapsed) {
            const leftRopeX = fp.x - (fp.w / 2) + 10;
            const rightRopeX = fp.x + (fp.w / 2) - 10;

            const hitLeftRope = Math.abs(fb.x - leftRopeX) < 18 && (fb.y >= 0 && fb.y <= fp.y + fp.h);
            const hitRightRope = Math.abs(fb.x - rightRopeX) < 18 && (fb.y >= 0 && fb.y <= fp.y + fp.h);

            if (hitLeftRope || hitRightRope) {
              if (fb.id === 'black') {
                triggerBombExplosion(fb.x, fb.y);
                flyingBirds.splice(i, 1);
                birdExploded = true;
                break;
              }
              collapseFloatingPlatform(fp, Math.abs(fb.vx));
              spawnExplosion(fb.x, fb.y, '#94a3b8', 12);
              fb.vx *= -0.3;
              fb.vy = 1.0;
            }

            const nearestX = Math.max(fp.x - fp.w / 2, Math.min(fb.x, fp.x + fp.w / 2));
            const nearestY = Math.max(fp.y, Math.min(fb.y, fp.y + fp.h));
            const dist = Math.hypot(fb.x - nearestX, fb.y - nearestY);
            if (dist < 18) {
              if (fb.id === 'black') {
                triggerBombExplosion(fb.x, fb.y);
                flyingBirds.splice(i, 1);
                birdExploded = true;
                break;
              }
              collapseFloatingPlatform(fp, Math.abs(fb.vx));
              fb.vx *= 0.75;
            }
          }
        }
        if (birdExploded) continue;

        // Structures Collision
        for (let k = structures.length - 1; k >= 0; k--) {
          const p = structures[k];
          const nearestX = Math.max(p.x, Math.min(fb.x, p.x + p.w));
          const nearestY = Math.max(p.y, Math.min(fb.y, p.y + p.h));
          const dist = Math.hypot(fb.x - nearestX, fb.y - nearestY);

          if (dist < 18) {
            if (fb.id === 'black') {
              triggerBombExplosion(fb.x, fb.y);
              flyingBirds.splice(i, 1);
              birdExploded = true;
              break;
            }

            spawnExplosion(nearestX, nearestY, p.color, 14);
            addScore(150);
            const tId = p.towerId;
            const fl = p.floor;
            structures.splice(k, 1);

            triggerCascadeFall(tId, fl);

            fb.vx *= 0.65;
            fb.vy = Math.min(fb.vy * 0.5, 1.5);
            break;
          }
        }
        if (birdExploded) continue;

        if (fb.y >= groundY - 12) {
          if (fb.id === 'black') {
            triggerBombExplosion(fb.x, groundY - 12);
            flyingBirds.splice(i, 1);
            continue;
          }
          fb.y = groundY - 12;
          fb.vy = -fb.vy * 0.35;
          fb.vx *= 0.7;
          fb.bounces = (fb.bounces || 0) + 1;
          if (fb.bounces > 4 || Math.abs(fb.vx) < 0.3) {
            flyingBirds.splice(i, 1);
          }
        } else if (fb.x > width + 60) {
          flyingBirds.splice(i, 1);
        }
      }

      // Structures Physics
      for (let i = structures.length - 1; i >= 0; i--) {
        const p = structures[i];

        if (p.collapsed) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += woodGravity;
          p.angle += p.va;

          if (p.x + p.w >= width - 6) {
            p.x = width - 6 - p.w;
            p.vx = -Math.abs(p.vx) * 0.3;
          }

          if (p.y + p.h >= groundY) {
            p.y = groundY - p.h;
            p.vy = -p.vy * 0.15;
            p.vx *= 0.70;
            p.va *= 0.60;
            if (Math.abs(p.vy) < 0.3) p.vy = 0;
            if (Math.abs(p.vx) < 0.1) p.vx = 0;
            if (Math.abs(p.va) < 0.01) p.va = 0;
          }

          p.restTimer++;
          if (p.restTimer > 45) {
            p.alpha -= 0.045;
            if (p.alpha <= 0) {
              spawnExplosion(p.x + p.w / 2, p.y + p.h / 2, p.color, 6);
              structures.splice(i, 1);
              continue;
            }
          }

          for (let t of targets) {
            if (t.alive) {
              const dist = Math.hypot(t.x - (p.x + p.w / 2), t.y - (p.y + p.h / 2));
              if (dist < t.r + 20) {
                t.alive = false;
                spawnExplosion(t.x, t.y, t.color, 24);
                addFloatingScore(t.x, t.y - 20, '+1000');
                addScore(1000);
                updateTargetCountHud();
                bigBirdEnergy = Math.min(100, bigBirdEnergy + 25);
              }
            }
          }
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }

      // Targets Physics
      for (let t of targets) {
        if (t.alive) {
          if (t.falling) {
            t.x += t.vx;
            t.y += t.vy;
            t.vy += woodGravity;

            if (t.y + t.r >= groundY - 4 || t.x + t.r >= width - 12) {
              t.alive = false;
              spawnExplosion(Math.min(t.x, width - 20), groundY - 10, t.color, 24);
              addFloatingScore(Math.min(t.x, width - 30), groundY - 24, '+1000');
              addScore(1000);
              updateTargetCountHud();
              bigBirdEnergy = Math.min(100, bigBirdEnergy + 25);
              continue;
            }
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
          ctx.fillStyle = t.color;
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(t.x - 4, t.y - 3, 3.5, 0, Math.PI * 2);
          ctx.arc(t.x + 4, t.y - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(t.x - 3.5, t.y - 3, 1.8, 0, Math.PI * 2);
          ctx.arc(t.x + 4.5, t.y - 3, 1.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(t.x, t.y + 4, 5, 0, Math.PI);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Confetti & Celebration rendering
      drawConfetti();

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += gravity * 0.4;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
          ctx.restore();
        }
      }

      // Floating Scores
      for (let i = floatingScores.length - 1; i >= 0; i--) {
        const fs = floatingScores[i];
        fs.y -= 1.2;
        fs.alpha -= 0.02;

        if (fs.alpha <= 0) {
          floatingScores.splice(i, 1);
        } else {
          ctx.save();
          ctx.globalAlpha = fs.alpha;
          ctx.fillStyle = '#fde047';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();
        }
      }

      checkLevelState();
      requestAnimationFrame(render);
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
      const cy = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (width / rect.width),
        y: (cy - rect.top) * (height / rect.height)
      };
    }

    window.addEventListener('pointerdown', (e) => {
      if (modal.style.display === 'flex' || bigBirdFalling) return;
      if (e.target.closest('.hud')) return;

      const pos = getCoords(e);
      const groundH = Math.max(height * 0.12, 42);
      const groundY = height - groundH;
      const treeX = Math.max(width * 0.065, 55);
      const anchorX = treeX + 175;
      const anchorY = groundY - 125;

      let gridClicked = false;
      for (let hb of birdHitboxes) {
        if (pos.x >= hb.x - (hb.w / 2) && pos.x <= hb.x + (hb.w / 2) &&
            pos.y >= hb.y - (hb.h / 2) && pos.y <= hb.y + (hb.h / 2)) {
          gridClicked = true;
          if (birdTypes[hb.index].count > 0) {
            selectedBirdIndex = hb.index;
          }
          break;
        }
      }
      if (gridClicked) return;

      const distToSling = Math.hypot(pos.x - anchorX, pos.y - anchorY);
      const currentBird = birdTypes[selectedBirdIndex];

      if (distToSling < 60 && currentBird && currentBird.count > 0) {
        isDragging = true;
        dragPos = { x: pos.x, y: pos.y };
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      const pos = getCoords(e);
      const groundH = Math.max(height * 0.12, 42);
      const groundY = height - groundH;
      const treeX = Math.max(width * 0.065, 55);
      const anchorX = treeX + 175;
      const anchorY = groundY - 125;

      const dx = pos.x - anchorX;
      const dy = pos.y - anchorY;
      const dist = Math.hypot(dx, dy);

      if (dist > maxDragDist) {
        const angle = Math.atan2(dy, dx);
        dragPos.x = anchorX + Math.cos(angle) * maxDragDist;
        dragPos.y = anchorY + Math.sin(angle) * maxDragDist;
      } else {
        dragPos.x = pos.x;
        dragPos.y = pos.y;
      }
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;

      const groundH = Math.max(height * 0.12, 42);
      const groundY = height - groundH;
      const treeX = Math.max(width * 0.065, 55);
      const anchorX = treeX + 175;
      const anchorY = groundY - 125;

      const dx = anchorX - dragPos.x;
      const dy = anchorY - dragPos.y;
      const dist = Math.hypot(dx, dy);

      if (dist > 14) {
        const activeBird = birdTypes[selectedBirdIndex];
        if (activeBird && activeBird.count > 0) {
          hasFirstFired = true;
          flyingBirds.push({
            id: activeBird.id,
            x: dragPos.x,
            y: dragPos.y,
            vx: dx * launchPower,
            vy: dy * launchPower,
            color: activeBird.color,
            name: activeBird.name
          });

          activeBird.count--;
          ensureAvailableBirdSelected();
        }
      }
    });

    restartBtn.addEventListener('click', () => {
      loadLevel(currentLevel);
    });

    resizeCanvas();
    render();
  </script>
</body>
</html>
