<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f18">
  <title>Hungry Birds v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Tap Layer -->
  <div id="start-overlay">
    <div class="play-badge">TAP TO PLAY</div>
    <div id="rotate-hint" style="margin-top: 14px; font-size: 13px; color: #cbd5e1;">
      📱 Tap to auto-rotate & go full screen
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <header id="top-hud">
      <div class="hud-left">
        <button id="btn-pause" class="hud-btn" aria-label="Pause Game">⏸</button>
        <button id="btn-sound" class="hud-btn" aria-label="Toggle Sound">🔊</button>
      </div>

      <div class="hud-right">
        <div class="score-badge">
          <span class="score-label">SCORE</span>
          <span id="score-val">0</span>
        </div>
        <div class="level-badge">
          <span class="level-label">LVL</span>
          <span id="level-val">1</span>
        </div>
      </div>
    </header>

    <footer id="bottom-hud">
      <div id="bird-queue" class="queue-container"></div>
      <div id="action-hint" class="hint-text">Tap anywhere: Red ➔ Orange ➔ Grey</div>
    </footer>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const startOverlay = document.getElementById('start-overlay');
      const container = document.getElementById('game-container');

      let width = window.innerWidth;
      let height = window.innerHeight;

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', () => setTimeout(resizeCanvas, 150));
      resizeCanvas();

      // Reliable Fullscreen & Landscape for Mobile/Brave
      function triggerMobileFullscreen() {
        startOverlay.style.display = 'none';

        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(() => {});
        }

        setTimeout(resizeCanvas, 350);
      }

      startOverlay.addEventListener('touchend', (e) => {
        e.preventDefault();
        triggerMobileFullscreen();
      }, { passive: false });

      startOverlay.addEventListener('click', triggerMobileFullscreen);

      // --- Left Cliff & Left Big Bird ---
      const bigBird = {
        stateIndex: 0,
        states: [
          { name: 'Hungry Rage', color: '#ff2e55' },
          { name: 'Craving',     color: '#ff922b' },
          { name: 'Starving',    color: '#64748b' }
        ],
        getColor() {
          return this.states[this.stateIndex].color;
        },
        draw() {
          const cliffW = width * 0.22;
          const cliffX = 0;
          const cliffY = height * 0.52;

          // 1. Rocky Cliff on LEFT
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.moveTo(0, cliffY);
          ctx.lineTo(cliffW, cliffY);
          ctx.lineTo(cliffW + 18, height);
          ctx.lineTo(0, height);
          ctx.closePath();
          ctx.fill();

          // Green grass top on cliff
          ctx.fillStyle = '#16a34a';
          ctx.fillRect(0, cliffY, cliffW + 5, 8);

          // 2. Big Bird Sitting on Left Cliff (Looking RIGHT towards target)
          const r = Math.min(width, height) * 0.11;
          const bx = cliffW * 0.55;
          const by = cliffY - r + 3;

          ctx.save();

          // Glow Aura
          ctx.beginPath();
          ctx.arc(bx, by, r + 8, 0, Math.PI * 2);
          ctx.fillStyle = this.getColor() + '33';
          ctx.fill();

          // Main Big Body
          ctx.beginPath();
          ctx.arc(bx, by, r, 0, Math.PI * 2);
          ctx.fillStyle = this.getColor();
          ctx.shadowColor = 'rgba(0,0,0,0.4)';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Eye looking RIGHT
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(bx + r * 0.35, by - r * 0.22, r * 0.25, 0, Math.PI * 2);
          ctx.fill();

          // Pupil
          ctx.fillStyle = '#111827';
          ctx.beginPath();
          ctx.arc(bx + r * 0.42, by - r * 0.22, r * 0.09, 0, Math.PI * 2);
          ctx.fill();

          // Open Hungry Beak facing RIGHT
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(bx + r * 0.55, by - r * 0.1);
          ctx.lineTo(bx + r * 1.05, by + r * 0.08);
          ctx.lineTo(bx + r * 0.55, by + r * 0.26);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      };

      // --- Slingshot in front of Cliff on Left ---
      const slingshot = {
        getX() { return width * 0.30; },
        getY() { return height * 0.65; },
        draw() {
          const sx = this.getX();
          const sy = this.getY();
          
          ctx.strokeStyle = '#8b5a2b';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';

          // Base Pole
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx, height);
          ctx.stroke();

          // Fork
          ctx.beginPath();
          ctx.moveTo(sx - 14, sy - 26);
          ctx.lineTo(sx, sy);
          ctx.lineTo(sx + 14, sy - 26);
          ctx.stroke();

          // Small Red Bird in Sling
          const br = 12;
          const bx = sx;
          const by = sy - 14;

          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(bx, by, br, 0, Math.PI * 2);
          ctx.fill();

          // Eye looking right
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(bx + 4, by - 3, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(bx + 5, by - 3, 1.5, 0, Math.PI * 2);
          ctx.fill();

          // Beak pointing right
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(bx + 8, by - 2);
          ctx.lineTo(bx + 16, by + 1);
          ctx.lineTo(bx + 8, by + 5);
          ctx.closePath();
          ctx.fill();
        }
      };

      // --- Suspended Slab shifted to the RIGHT Side (Target Area) ---
      function drawSuspendedPlatform() {
        const px = width * 0.72;
        const py = height * 0.45;
        const pw = 120;
        const ph = 12;

        // Ropes from top ceiling
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px - pw/2 + 12, 0);
        ctx.lineTo(px - pw/2 + 12, py);
        ctx.moveTo(px + pw/2 - 12, 0);
        ctx.lineTo(px + pw/2 - 12, py);
        ctx.stroke();

        // Wooden Platform Slab
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(px - pw/2, py, pw, ph, 4) : ctx.rect(px - pw/2, py, pw, ph);
        ctx.fill();

        // Target box on suspended slab
        ctx.fillStyle = '#eab308';
        ctx.fillRect(px - 14, py - 26, 26, 26);
        ctx.strokeStyle = '#a16207';
        ctx.lineWidth = 2;
        ctx.strokeRect(px - 14, py - 26, 26, 26);
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);

        // Dark sky background
        const bg = ctx.createLinearGradient(0, 0, 0, height);
        bg.addColorStop(0, '#0f172a');
        bg.addColorStop(1, '#1e293b');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        // Ground Floor
        ctx.fillStyle = '#166534';
        ctx.fillRect(0, height - 12, width, 12);

        // Render Entities
        bigBird.draw();
        slingshot.draw();
        drawSuspendedPlatform();

        requestAnimationFrame(loop);
      }
      loop();

      // Screen Tap: Red -> Orange -> Grey -> Red
      window.addEventListener('pointerup', () => {
        if (startOverlay.style.display === 'none') {
          bigBird.stateIndex = (bigBird.stateIndex + 1) % bigBird.states.length;
        }
      });
    });
  </script>
</body>
</html>
